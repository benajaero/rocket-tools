[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-tools"
version = "0.4.1"
description = "Fast, reference-validated aerospace engineering calculations for Python, the CLI, and MCP agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
keywords = ["aerospace", "engineering", "mcp", "aerodynamics", "structural-analysis"]
authors = [
    {name = "Chukwudiebube E. Ajaero"},
    {name = "Human Engine Labs", email = "engineering@humanengine.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "numba>=0.58",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "matplotlib>=3.7",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
rocket-tools = "rocket_tools.cli:main"

[project.urls]
Homepage = "https://www.humanengine.co/"
Repository = "https://github.com/benajaero/rocket-tools"
Issues = "https://github.com/benajaero/rocket-tools/issues"
Changelog = "https://github.com/benajaero/rocket-tools/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rocket_tools = ["py.typed", "workflows/built_in/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/rust_kernels/*", "src/rocket_tools/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
