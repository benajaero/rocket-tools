[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-tools"
version = "0.3.3"
description = "Aerospace engineering intelligence for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Human Engine labs", email = "engineering@humanengine.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "numba>=0.58",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "matplotlib>=3.7",
]

[project.scripts]
rocket-tools = "rocket_tools.server:main"

[project.urls]
Homepage = "https://www.humanengine.co/"
Repository = "https://github.com/benajaero/rocket-tools"
Issues = "https://github.com/benajaero/rocket-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/rust_kernels/*", "src/rocket_tools/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
