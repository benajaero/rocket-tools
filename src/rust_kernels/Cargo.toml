[package]
name = "rocket-tools-kernels"
version = "0.1.0"
edition = "2021"

[lib]
name = "rocket_tools_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
